<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tank Game - Bekleme Odasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sayfa giriş animasyonu */
        main {
            animation: fadeInScale 0.5s ease-out;
        }

        section {
            animation: slideUpFade 0.6s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Oyuncu listesi item animasyonu */
        #player-list > li {
            animation: fadeInUp 0.3s ease-out backwards;
        }

        #player-list > li:nth-child(1) { animation-delay: 0.1s; }
        #player-list > li:nth-child(2) { animation-delay: 0.2s; }
        #player-list > li:nth-child(3) { animation-delay: 0.3s; }
        #player-list > li:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Buton hover ve animasyonları */
        button {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
        }

        button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        #start-game-btn:hover {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.5) !important;
        }

        /* Ripple efekti */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Kurucu etiketi pulse */
        .host-badge {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* Loading durumu */
        .loading-item {
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        /* Mesaj animasyonu */
        #room-message:not(.hidden) {
            animation: slideInUp 0.3s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Oda başlık animasyonu */
        .border-b {
            animation: fadeInSlideDown 0.5s ease-out;
        }

        @keyframes fadeInSlideDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Oyuncu sayacı glow */
        #player-count {
            color: #10b981;
            transition: all 0.3s ease;
        }

        /* Buton grup animasyonu */
        .flex.flex-col.gap-3 {
            animation: fadeInUp 0.6s ease-out;
            animation-delay: 0.3s;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col justify-center px-4 py-8">
        <section class="rounded-lg border border-slate-700 bg-slate-900 p-6 shadow-2xl">
            <div class="flex flex-col gap-4 border-b border-slate-700 pb-5 sm:flex-row sm:items-start sm:justify-between">
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider text-emerald-400">Bekleme Odasi</p>
                    <h1 id="room-name" class="mt-2 text-2xl font-bold text-white">Oda yukleniyor...</h1>
                    <p class="mt-2 text-sm text-slate-400">
                        Oda ID:
                        <span id="room-id" class="font-mono text-slate-200"></span>
                    </p>
                </div>

                <div class="rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-right">
                    <p class="text-xs uppercase text-slate-500">Oyuncular</p>
                    <p class="mt-1 text-xl font-bold">
                        <span id="player-count">0</span>/<span id="max-players">0</span>
                    </p>
                </div>
            </div>

            <div class="py-6">
                <h2 class="mb-3 text-sm font-bold uppercase tracking-wider text-slate-400">Komutanlar</h2>
                <ul id="player-list" class="space-y-3">
                    <li class="rounded border border-slate-700 bg-slate-800 p-3 text-slate-400">
                        Oyuncular yukleniyor...
                    </li>
                </ul>
            </div>

            <p id="room-message" class="hidden rounded-lg border border-amber-800 bg-amber-950/40 px-4 py-3 text-sm text-amber-300"></p>

            <div class="mt-6 flex flex-col gap-3 border-t border-slate-700 pt-5 sm:flex-row">
                <button id="leave-room-btn" type="button" class="flex-1 rounded-lg border border-slate-600 bg-slate-800 px-4 py-3 font-bold text-white transition hover:bg-slate-700">
                    MERKEZE DON
                </button>
                <button id="start-game-btn" type="button" class="flex-1 rounded-lg bg-emerald-600 px-4 py-3 font-bold text-white shadow-lg shadow-emerald-950 transition hover:bg-emerald-500">
                    SAVASI BASLAT
                </button>
            </div>
        </section>
    </main>

    <script src="/js/game-room.js"></script>
</body>
</html>
