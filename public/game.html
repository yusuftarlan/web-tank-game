<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tank Game</title>
    <link rel="stylesheet" href="/css/game.css">
</head>
<body>
    <main id="game-root">
        <canvas id="game-canvas" width="960" height="540"></canvas>
        <div id="damage-overlay" aria-hidden="true"></div>
        <section id="game-hud" aria-label="Oyun bilgileri"></section>
        <aside id="network-debug" aria-label="Ağ debug bilgileri">
            <div><span>Ping</span><strong data-net-debug="ping">-- ms</strong></div>
            <div><span>Jitter</span><strong data-net-debug="jitter">-- ms</strong></div>
            <div><span>State/s</span><strong data-net-debug="stateRate">--</strong></div>
            <div><span>Packet</span><strong data-net-debug="packetSize">-- B</strong></div>
        </aside>
    </main>
    <script type="module" src="/js/game-client.js"></script>
</body>
</html>
