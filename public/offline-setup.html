<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tank Game - Offline</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <main class="max-w-4xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between gap-4 md:items-center bg-slate-800 p-4 rounded-xl border border-slate-700 mb-8 shadow-lg">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400 tracking-wider">OFFLINE CEPHE</h1>
                <p class="text-sm text-slate-400 mt-1">Ayni klavyede 2-4 komutan</p>
            </div>
            <a href="/main-menu" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded-lg transition border border-slate-600">
                KARARGAHA DON
            </a>
        </header>

        <section class="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-8">
            <form id="offline-setup-form" class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-lg">
                <h2 class="text-xl font-semibold text-slate-200 mb-5">Oyuncu Sayisi</h2>
                <div class="grid grid-cols-3 gap-3 mb-8">
                    <label class="cursor-pointer">
                        <input class="peer sr-only" type="radio" name="playerCount" value="2" checked>
                        <span class="block text-center rounded-lg border border-slate-600 bg-slate-900 py-4 font-bold peer-checked:border-emerald-500 peer-checked:text-emerald-300 peer-checked:bg-emerald-950/50">2</span>
                    </label>
                    <label class="cursor-pointer">
                        <input class="peer sr-only" type="radio" name="playerCount" value="3">
                        <span class="block text-center rounded-lg border border-slate-600 bg-slate-900 py-4 font-bold peer-checked:border-emerald-500 peer-checked:text-emerald-300 peer-checked:bg-emerald-950/50">3</span>
                    </label>
                    <label class="cursor-pointer">
                        <input class="peer sr-only" type="radio" name="playerCount" value="4">
                        <span class="block text-center rounded-lg border border-slate-600 bg-slate-900 py-4 font-bold peer-checked:border-emerald-500 peer-checked:text-emerald-300 peer-checked:bg-emerald-950/50">4</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg shadow-emerald-900 tracking-wide">
                    SAVASI BASLAT
                </button>
            </form>

            <aside class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-lg">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-slate-700 pb-2">Kontroller</h2>
                <ul class="space-y-3 text-sm text-slate-300">
                    <li><span class="text-blue-300 font-bold">1.</span> WASD / Space</li>
                    <li><span class="text-red-300 font-bold">2.</span> Yon tuslari / Enter</li>
                    <li><span class="text-green-300 font-bold">3.</span> IJKL / Ç</li>
                    <li><span class="text-slate-300 font-bold">4.</span> 8456 / +</li>
                </ul>
            </aside>
        </section>
    </main>

    <script src="/js/offline-setup.js"></script>
</body>
</html>
