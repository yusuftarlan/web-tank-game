<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tank Game - Karargâh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-5xl mx-auto">
        <!-- Üst Bilgi Çubuğu -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 mb-8 shadow-lg">
            <div class="flex items-center gap-3 mb-4 md:mb-0">
                <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M4 17h16a1 1 0 001-1v-2a1 1 0 00-1-1H4a1 1 0 00-1 1v2a1 1 0 001 1zM8 13V9a2 2 0 012-2h4a2 2 0 012 2v4M12 7V3m0 0H9m3 0h3"></path></svg>
                <h1 class="text-2xl font-bold text-emerald-400 tracking-wider">KARARGÂH</h1>
            </div>
            <div class="flex items-center gap-4 bg-slate-900 px-4 py-2 rounded-lg border border-slate-700">
                <span class="text-slate-400 text-sm">Komutan: <strong id="username-display" class="text-white text-base ml-1">...</strong></span>
                <div class="w-px h-5 bg-slate-700"></div>
                <a href="/" id="logout-btn" class="text-red-400 hover:text-red-300 text-sm font-medium transition">Çıkış Yap</a>
            </div>
        </header>
        
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Sol Taraf: Oda Listesi -->
            <div class="lg:col-span-2 bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-lg h-[550px] flex flex-col relative overflow-hidden">
                <div class="absolute top-0 right-0 w-64 h-64 bg-slate-700 rounded-full blur-[100px] opacity-10 pointer-events-none"></div>
                
                <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-3 relative z-10">
                    <h2 class="text-xl font-semibold text-slate-200">Aktif Savaş Odaları</h2>
                    <button onclick="window.location.reload()" class="text-emerald-400 hover:text-emerald-300 text-sm flex items-center gap-1 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Yenile
                    </button>
                </div>

                <div id="room-list" class="flex-1 overflow-y-auto space-y-3 pr-2 relative z-10 custom-scrollbar">
                    <!-- Javascript buraya odaları basacak. Güzelleşmesi için JS içindeki yapıyı da Tailwind classları ile güncelleyebilirsin -->
                    <div class="p-4 bg-slate-900 rounded-lg border border-slate-700 text-center text-slate-500 mt-10">
                        Sinyal taranıyor... Odalar yükleniyor.
                    </div>
                </div>
            </div>
            
            <!-- Sağ Taraf: Aksiyonlar & Bilgi -->
            <div class="flex flex-col gap-6">
                <!-- Yeni Oda -->
                <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-lg text-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-emerald-600 opacity-0 group-hover:opacity-10 transition duration-300 pointer-events-none"></div>
                    <div class="w-16 h-16 mx-auto bg-slate-900 rounded-full flex items-center justify-center border-2 border-emerald-500 mb-4 shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    </div>
                    <h3 class="text-lg font-medium mb-4 text-slate-200">Kendi Cepheni Kur</h3>
                    <a href="/new-game.html" class="block w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg shadow-emerald-900 tracking-wide">YENİ ODA OLUŞTUR</a>
                </div>

                <!-- Offline Oyun -->
                <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-lg text-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-sky-600 opacity-0 group-hover:opacity-10 transition duration-300 pointer-events-none"></div>
                    <div class="w-16 h-16 mx-auto bg-slate-900 rounded-full flex items-center justify-center border-2 border-sky-500 mb-4 shadow-[0_0_15px_rgba(14,165,233,0.25)]">
                        <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-4-4h-1M9 20H4v-2a4 4 0 014-4h1m8-4a4 4 0 10-8 0 4 4 0 008 0z"></path></svg>
                    </div>
                    <h3 class="text-lg font-medium mb-4 text-slate-200">Ayni Klavyede Savas</h3>
                    <a href="/offline-setup.html" class="block w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg shadow-sky-950 tracking-wide">OFFLINE OYNA</a>
                </div>

                <!-- Kontroller -->
                <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-lg flex-1">
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-slate-700 pb-2">Kontrol Paneli</h3>
                    <ul class="space-y-4 text-sm text-slate-300">
                        <li class="flex items-center gap-3">
                            <span class="bg-slate-900 border border-slate-600 text-emerald-400 px-2 py-1 rounded font-mono text-xs">W A S D</span>
                            <span>Tankı Hareket Ettir</span>
                        </li>
                        <li class="flex items-center gap-3">
                            <span class="bg-slate-900 border border-slate-600 text-emerald-400 px-2 py-1 rounded font-mono text-xs">MOUSE</span>
                            <span>Namluyu Çevir</span>
                        </li>
                        <li class="flex items-center gap-3">
                            <span class="bg-slate-900 border border-slate-600 text-emerald-400 px-2 py-1 rounded font-mono text-xs">SOL TIK</span>
                            <span>Ateş Et</span>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/main-menu.js"></script>
</body>
</html>
