<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tank Game - Bekleme Odasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col justify-center px-4 py-8">
        <section class="rounded-lg border border-slate-700 bg-slate-900 p-6 shadow-2xl">
            <div class="flex flex-col gap-4 border-b border-slate-700 pb-5 sm:flex-row sm:items-start sm:justify-between">
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider text-emerald-400">Bekleme Odasi</p>
                    <h1 id="room-name" class="mt-2 text-2xl font-bold text-white">Oda yukleniyor...</h1>
                    <p class="mt-2 text-sm text-slate-400">
                        Oda ID:
                        <span id="room-id" class="font-mono text-slate-200"></span>
                    </p>
                </div>

                <div class="rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-right">
                    <p class="text-xs uppercase text-slate-500">Oyuncular</p>
                    <p class="mt-1 text-xl font-bold">
                        <span id="player-count">0</span>/<span id="max-players">0</span>
                    </p>
                </div>
            </div>

            <div class="py-6">
                <h2 class="mb-3 text-sm font-bold uppercase tracking-wider text-slate-400">Komutanlar</h2>
                <ul id="player-list" class="space-y-3">
                    <li class="rounded border border-slate-700 bg-slate-800 p-3 text-slate-400">
                        Oyuncular yukleniyor...
                    </li>
                </ul>
            </div>

            <p id="room-message" class="hidden rounded-lg border border-amber-800 bg-amber-950/40 px-4 py-3 text-sm text-amber-300"></p>

            <div class="mt-6 flex flex-col gap-3 border-t border-slate-700 pt-5 sm:flex-row">
                <button id="leave-room-btn" type="button" class="flex-1 rounded-lg border border-slate-600 bg-slate-800 px-4 py-3 font-bold text-white transition hover:bg-slate-700">
                    MERKEZE DON
                </button>
                <button id="start-game-btn" type="button" class="flex-1 rounded-lg bg-emerald-600 px-4 py-3 font-bold text-white shadow-lg shadow-emerald-950 transition hover:bg-emerald-500">
                    SAVASI BASLAT
                </button>
            </div>
        </section>
    </main>

    <script src="/js/game-room.js"></script>
</body>
</html>
