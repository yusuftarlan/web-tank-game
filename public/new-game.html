<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tank Game - Oda Oluştur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sayfa giriş animasyonu */
        main {
            animation: zoomInFade 0.5s ease-out;
        }

        @keyframes zoomInFade {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Form input animasyonları */
        input, select {
            transition: all 0.3s ease;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input:nth-of-type(1) { animation-delay: 0.1s; }
        select { animation-delay: 0.2s; }

        /* Input focus glow */
        input:focus,
        select:focus {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4) !important;
            transform: translateY(-2px);
        }

        /* Buton hover efektleri */
        button, a {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        button:hover:not(:disabled),
        a:hover {
            transform: translateY(-3px);
        }

        button:active:not(:disabled),
        a:active {
            transform: translateY(-1px);
        }

        /* Başarı butonu glow */
        button[type="submit"]:hover {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.5) !important;
        }

        /* Ripple efekti */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Error message animasyonu */
        #error-message:not(.hidden) {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* Label animasyonu */
        label {
            animation: fadeInUp 0.4s ease-out;
        }

        label:nth-of-type(1) { animation-delay: 0.05s; }
        label:nth-of-type(2) { animation-delay: 0.15s; }

        /* Form button grubu animasyonu */
        .flex.gap-4 {
            animation: fadeInUp 0.5s ease-out;
            animation-delay: 0.3s;
        }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen text-slate-100 font-sans">
    
    <main class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 w-[28rem] relative">
        <div class="absolute -top-4 -left-4 w-24 h-24 bg-emerald-500 rounded-full blur-[60px] opacity-20 pointer-events-none"></div>

        <h1 class="text-2xl font-bold mb-8 text-emerald-400 border-b border-slate-700 pb-3 flex items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            YENİ CEPHE OLUŞTUR
        </h1>
        
        <form id="create-room-form" class="space-y-6">
            <div>
                <label for="roomName" class="block text-sm font-medium text-slate-400 mb-2">Oda (Cephe) Adı</label>
                <input id="roomName" name="roomName" type="text" autocomplete="off" 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-white placeholder-slate-600" 
                    placeholder="Örn: Alfa Takımı" required>
            </div>
            
            <div>
                <label for="maxPlayers" class="block text-sm font-medium text-slate-400 mb-2">Maksimum Kapasite</label>
                <div class="relative">
                    <select id="maxPlayers" name="maxPlayers" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition appearance-none text-white cursor-pointer">
                        <option value="2">2 Komutan (Düello)</option>
                        <option value="3">3 Komutan (Karmaşa)</option>
                        <option value="4" selected>4 Komutan (Tam Savaş)</option>
                    </select>
                    <!-- Özel ok işareti -->
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-4 pt-4 mt-8 border-t border-slate-700">
                <a href="/main-menu" class="flex-1 bg-slate-700 hover:bg-slate-600 text-center text-white font-bold py-3 px-4 rounded-lg transition border border-slate-600 hover:border-slate-500">
                    İPTAL ET
                </a>
                <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg shadow-emerald-900 hover:shadow-emerald-700">
                    ODAYI KUR
                </button>
            </div>
        </form>
        <p id="error-message" aria-live="polite" class="mt-4 text-sm text-red-400 hidden text-center bg-red-900/30 py-2 rounded"></p>
    </main>

    <script src="/js/new-game.js"></script>
</body>
</html>
