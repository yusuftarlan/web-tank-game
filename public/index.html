<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tank Game - Giriş</title>
    <!-- Tailwind CSS (Arayüzü güzelleştirmek için) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen text-slate-100 font-sans">
    
    <main class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 w-96 text-center relative overflow-hidden">
        <!-- Dekoratif Arkaplan Işığı -->
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-32 bg-emerald-500 rounded-full blur-[80px] opacity-20 pointer-events-none"></div>

        <!-- Tank İkonu -->
        <div class="mb-6 flex justify-center relative z-10">
            <svg class="w-16 h-16 text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M4 17h16a1 1 0 001-1v-2a1 1 0 00-1-1H4a1 1 0 00-1 1v2a1 1 0 001 1zM8 13V9a2 2 0 012-2h4a2 2 0 012 2v4M12 7V3m0 0H9m3 0h3"></path>
            </svg>
        </div>
        
        <h1 class="text-3xl font-bold mb-8 tracking-widest text-emerald-400 relative z-10">TANK SAVAŞI</h1>
        
        <form id="login-form" class="space-y-5 relative z-10">
            <div class="text-left">
                <label for="username" class="block text-sm font-medium text-slate-400 mb-1">Komutan Adı</label>
                <input id="username" name="username" type="text" autocomplete="off" 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition shadow-inner text-white placeholder-slate-600" 
                    placeholder="Adınızı girin" required>
            </div>
            <button type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-[0_0_15px_rgba(16,185,129,0.3)] hover:shadow-[0_0_25px_rgba(16,185,129,0.5)] tracking-wide">
                KARARGÂHA GİRİŞ YAP
            </button>
        </form>
        
        <p id="login-message" aria-live="polite" class="mt-4 text-sm text-red-400 min-h-[20px] font-medium relative z-10"></p>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
